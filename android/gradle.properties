org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Work around corrupted Kotlin incremental caches on this machine.
kotlin.incremental=false
kotlin.compiler.execution.strategy=in-process
# Avoid timeout: fewer parallel workers, longer HTTP timeouts
org.gradle.parallel=false
org.gradle.caching=true
org.gradle.daemon=true
systemProp.org.gradle.internal.http.connectionTimeout=120000
systemProp.org.gradle.internal.http.socketTimeout=120000
